  <title id="title">Exercise 06: recognize an ambiguous merged zone</title><desc id="desc">Two 6 mm disks sit inside one merged synthetic pale region; no separate diameter answer is available. Geometry only.</desc>
  <rect width="600" height="600" fill="#f6f7f3"/><text x="300" y="28" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#24332e">Practice — decide whether this case is gradable</text>
  <circle cx="300" cy="275" r="250" fill="#e8e4d4" stroke="#74796e" stroke-width="3"/><path d="M 220 275 C 220 235 248 208 285 208 C 320 208 337 229 355 229 C 373 229 390 246 390 275 C 390 312 360 337 326 337 C 307 337 294 324 276 324 C 244 324 220 306 220 275 Z" fill="#d8ead1" stroke="#72936a" stroke-width="2"/>
  <circle cx="270" cy="275" r="16.667" fill="#f5f4ee" stroke="#62665e" stroke-width="2"/><circle cx="350" cy="275" r="16.667" fill="#f5f4ee" stroke="#62665e" stroke-width="2"/>
  <line x1="220" y1="555" x2="275.556" y2="555" stroke="#24332e" stroke-width="4"/><line x1="220" y1="549" x2="220" y2="561" stroke="#24332e" stroke-width="2"/><line x1="275.556" y1="549" x2="275.556" y2="561" stroke="#24332e" stroke-width="2"/><text x="248" y="580" text-anchor="middle" font-family="sans-serif" font-size="14" fill="#24332e">10 mm scale</text>
  <text x="390" y="510" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#59645d">Choose “needs review”; do not invent two zone edges.</text>
