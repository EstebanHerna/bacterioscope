<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-labelledby="title desc">
  <title id="title">Exercise 03: measure one zone</title><desc id="desc">Synthetic circular plate illustration, 6 mm disk, 26 mm constructed zone, and 10 mm scale bar. Geometry only.</desc>
  <rect width="600" height="600" fill="#f6f7f3"/><text x="300" y="28" text-anchor="middle" font-family="sans-serif" font-size="17" fill="#24332e">Practice — measure the outer zone diameter</text>
