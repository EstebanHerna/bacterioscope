<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BacterioScope · Lectura de placa</title>
  <meta name="description" content="BacterioScope mide cada halo de una placa Kirby-Bauer sobre la foto, marca las mediciones en las que no confía y redacta una revisión que solo cita evidencia.">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible+Mono:wght@400;500;700&family=Atkinson+Hyperlegible+Next:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="/static/app.css">
  <script src="/static/app.js" defer></script>
</head>
<body>
  <svg class="defs" aria-hidden="true" focusable="false">
    <defs>
      <pattern id="flag-hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
        <line x1="0" y1="0" x2="0" y2="6" class="hatch-line"></line>
      </pattern>
      <symbol id="i-upload" viewBox="0 0 20 20"><path d="M10 13V3.5M6 7.5l4-4 4 4M3.5 13v3.5h13V13"/></symbol>
      <symbol id="i-grid" viewBox="0 0 20 20"><path d="M3 3h14v14H3zM3 7.67h14M3 12.33h14M7.67 3v14M12.33 3v14"/></symbol>
      <symbol id="i-contour" viewBox="0 0 20 20"><path d="M10 2.5c4.4 0 7.5 3 7.5 7.2 0 4.6-3.3 7.8-7.6 7.8-4.4 0-7.4-3.4-7.4-7.6 0-4.5 3.2-7.4 7.5-7.4z"/><circle cx="10" cy="10" r="2"/></symbol>
      <symbol id="i-reset" viewBox="0 0 20 20"><path d="M4 10a6 6 0 1 0 1.8-4.3M4 3.5v3.3h3.3"/></symbol>
      <symbol id="i-download" viewBox="0 0 20 20"><path d="M10 3.5V13M6 9l4 4 4-4M3.5 16.5h13"/></symbol>
      <symbol id="i-out" viewBox="0 0 20 20"><path d="M11 4h5v5M16 4l-7 7M14 11.5v4.5H4V6h4.5"/></symbol>
      <symbol id="i-flag" viewBox="0 0 20 20"><path d="M5 17.5V3M5 3.5h9.5l-2 3.25 2 3.25H5"/></symbol>
    </defs>
  </svg>

  <header class="strip">
    <a class="brand" href="/" aria-label="BacterioScope">
      <svg class="brand-mark" viewBox="0 0 28 28" aria-hidden="true">
        <circle cx="14" cy="14" r="12.5"/>
        <circle cx="14" cy="6.5" r="2.4" class="fill"/>
        <circle cx="20.5" cy="17.7" r="2.4" class="fill"/>
        <circle cx="7.5" cy="17.7" r="2.4" class="fill"/>
        <circle cx="14" cy="6.5" r="5.2" class="halo"/>
      </svg>
      <span>BacterioScope</span>
    </a>
    <p class="readout" id="calibration" aria-live="polite"></p>
    <span class="badge strip-badge" id="strip-sample" data-i18n="syntheticSample" hidden></span>
    <div class="strip-actions">
      <button type="button" class="btn-quiet" id="new-plate" hidden>
        <svg class="icon"><use href="#i-upload"/></svg><span data-i18n="newPlate"></span>
      </button>
      <div class="lang" role="group" aria-label="Idioma / Language">
        <button type="button" data-lang="es" aria-pressed="true">ES</button>
        <button type="button" data-lang="en" aria-pressed="false">EN</button>
      </div>
    </div>
  </header>

  <main class="box" id="box" data-state="intake">
    <section class="stage" aria-labelledby="stage-title">
      <h1 class="visually-hidden" id="stage-title" data-i18n="stageTitle"></h1>

      <div class="intake" id="intake">
        <div class="intake-ring" id="dropzone">
          <svg class="dashed-ring" viewBox="0 0 100 100" aria-hidden="true">
            <circle cx="50" cy="50" r="48"/>
            <circle cx="50" cy="50" r="48" class="sweep"/>
          </svg>
          <div class="intake-copy">
            <p class="intake-lead" data-i18n="intakeLead"></p>
            <p class="intake-sub" data-i18n="intakeSub"></p>
            <label class="btn-primary file-btn">
              <svg class="icon"><use href="#i-upload"/></svg>
              <span data-i18n="choosePhoto"></span>
              <input type="file" id="file-input" accept="image/jpeg,image/png,image/bmp,image/tiff">
            </label>
            <p class="intake-error" id="intake-error" role="alert" hidden></p>
          </div>
        </div>
        <div class="samples">
          <h2 class="samples-title" data-i18n="samplesTitle"></h2>
          <ul class="sample-list" id="sample-list"></ul>
        </div>
      </div>

      <figure class="plate" id="plate" hidden>
        <div class="plate-frame" id="plate-frame">
          <svg id="overlay" class="overlay" role="group"></svg>
        </div>
        <figcaption class="plate-tools">
          <button type="button" class="tool" id="toggle-grid" aria-pressed="false">
            <svg class="icon"><use href="#i-grid"/></svg><span data-i18n="toggleGrid"></span>
          </button>
          <button type="button" class="tool" id="toggle-contours" aria-pressed="true">
            <svg class="icon"><use href="#i-contour"/></svg><span data-i18n="toggleContours"></span>
          </button>
          <p class="legend"><svg class="swatch" aria-hidden="true"><rect width="14" height="14" fill="url(#flag-hatch)"/></svg><span data-i18n="legendFlag"></span></p>
          <p class="legend"><svg class="order-glyph" viewBox="0 0 22 14" aria-hidden="true"><path class="lg-origin" d="M1.5 2.5h6l-3 5z"/><path class="lg-arc" d="M9 3.5a16 16 0 0 1 11.5 7"/></svg><span data-i18n="legendOrder"></span></p>
          <p class="hint" data-i18n="dragHint"></p>
        </figcaption>
      </figure>
    </section>

    <section class="bench" aria-labelledby="bench-title" id="bench" hidden>
      <div class="bench-head">
        <h2 id="bench-title" data-i18n="benchTitle"></h2>
        <div class="bench-controls">
          <label class="field">
            <span data-i18n="organism"></span>
            <input type="text" id="organism" list="organisms" value="Escherichia coli" autocomplete="off" spellcheck="false">
            <datalist id="organisms">
              <option value="Escherichia coli"></option>
              <option value="Klebsiella pneumoniae"></option>
              <option value="Enterobacter cloacae"></option>
              <option value="Proteus mirabilis"></option>
              <option value="Serratia marcescens"></option>
              <option value="Citrobacter freundii"></option>
            </datalist>
          </label>
          <label class="field">
            <span data-i18n="panel"></span>
            <select id="panel-select"></select>
          </label>
        </div>
      </div>

      <div class="bench-scroll">
        <ol class="ruler-list" id="ruler-list"></ol>
        <p class="bench-note" data-i18n="benchNote"></p>
      </div>

      <div class="bench-foot">
        <div class="loupe" id="loupe" hidden aria-hidden="true">
          <canvas id="loupe-canvas" width="360" height="360"></canvas>
          <p class="loupe-label" id="loupe-label"></p>
        </div>
        <div class="foot-actions">
          <p class="correction-note" id="correction-note" hidden></p>
          <label class="check">
            <input type="checkbox" id="use-alerts" checked>
            <span data-i18n="useAlerts"></span>
          </label>
          <button type="button" class="btn-primary" id="review-btn">
            <span data-i18n="reviewBtn"></span>
          </button>
        </div>
      </div>
    </section>
  </main>

  <section class="review" id="review" hidden aria-labelledby="review-title">
    <div class="review-main">
      <div class="review-head">
        <h2 id="review-title" data-i18n="reviewTitle"></h2>
        <span class="badge" id="review-sample" data-i18n="syntheticSample" hidden></span>
      </div>
      <p class="review-status" id="review-status"></p>
      <div class="explanation" id="explanation"></div>
      <ul class="citations" id="citations"></ul>
      <div class="results-wrap">
        <table class="results" id="results">
          <caption data-i18n="resultsTitle"></caption>
          <thead>
            <tr>
              <th scope="col">#</th>
              <th scope="col" data-i18n="colDrug"></th>
              <th scope="col" class="num" data-i18n="colMm"></th>
              <th scope="col" data-i18n="colCat"></th>
              <th scope="col" data-i18n="colNote"></th>
            </tr>
          </thead>
          <tbody></tbody>
        </table>
      </div>
      <div class="signoff">
        <label class="field">
          <span data-i18n="reviewer"></span>
          <input type="text" id="reviewer" autocomplete="name">
        </label>
        <button type="button" class="btn-primary" id="download-btn">
          <svg class="icon"><use href="#i-download"/></svg><span data-i18n="download"></span>
        </button>
      </div>
    </div>
    <aside class="review-evidence">
      <h3 data-i18n="coverageTitle"></h3>
      <dl class="coverage" id="coverage"></dl>
      <h3 data-i18n="alertsTitle"></h3>
      <ul class="alerts" id="alerts"></ul>
      <h3 data-i18n="traceTitle"></h3>
      <dl class="trace" id="trace"></dl>
    </aside>
  </section>

  <footer class="disclaimer">
    <p data-i18n="disclaimer"></p>
  </footer>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
</body>
</html>
